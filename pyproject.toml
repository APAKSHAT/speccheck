[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specheck"
version = "0.1.0"
description = "Contract testing harness for REST APIs — reads an OpenAPI spec, generates test cases, validates responses, and reports drift as JUnit XML."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Akshat Pandey" },
]
keywords = ["openapi", "contract-testing", "rest", "api", "pytest", "junit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "click>=8.1",
    "junit-xml>=1.9",
    "openapi-spec-validator>=0.7",
    "prance>=23.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
specheck = "specheck.cli:main"

[project.urls]
Homepage = "https://github.com/akshatpandey/specheck"
Repository = "https://github.com/akshatpandey/specheck"

[tool.setuptools.packages.find]
include = ["specheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "specheck: marks tests as specheck contract tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
